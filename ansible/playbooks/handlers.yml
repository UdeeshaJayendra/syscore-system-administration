---
- name: Demonstrate Ansible handlers
  hosts: local
  become: true

  tasks:
    - name: Update SysCore configuration
      ansible.builtin.copy:
        content: |
          Managed by Ansible
          Project: SysCore
          Handler demonstration enabled
        dest: /etc/syscore/syscore.conf
        owner: root
        group: root
        mode: '0644'
      notify: Report configuration change

  handlers:
    - name: Report configuration change
      ansible.builtin.debug:
        msg: "Handler triggered because the configuration changed"
